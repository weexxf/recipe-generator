<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор рецептів на вечерю</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js" defer></script>
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <h1>Генератор рецептів на вечерю</h1>
        <nav>
            <a href="#generate">Генерувати рецепт</a>
            <a href="#recipe">Переглянути рецепт</a>
            <a href="#history">Історія рецептів</a>
        </nav>
    </header>

    <main>
        <section id="generate">
            <h2>Згенерувати рецепт</h2>
            <button type="button" id="generate-button">Згенерувати</button>
            <p id="loading-status" hidden>Завантаження рецепта...</p>
            <p id="error-message" role="alert" hidden></p>
            <button type="button" id="refresh-button">Оновити</button>
            <form id="recipe-filter">
                <label for="vegetarian-only">
                    <input type="checkbox" id="vegetarian-only">
                    Тільки вегетаріанські
                </label>
            </form>
        </section>

        <div id="vue-app"></div>

    </main>

    <footer>
        <p>&copy; Навчальне призначення. 2026 рік.</p>
    </footer>
</body>

</html>
